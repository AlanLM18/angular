<p-toast position="top-right" />

<div class="login-wrapper">
  <p-card styleClass="login-card">
    <ng-template pTemplate="header">
      <div class="login-header">
        <div class="login-logo"><i class="pi pi-building"></i></div>
        <h2>Iniciar Sesión</h2>
        <p>Ingresa tus credenciales para continuar</p>
      </div>
    </ng-template>

    <div class="field">
      <label for="username">Usuario</label>
      <input
        pInputText
        id="username"
        [(ngModel)]="username"
        placeholder="Ingresa tu usuario"
        [class.ng-invalid]="usernameInvalid"
        [class.ng-dirty]="usernameInvalid"
        class="w-full"
        (keydown.enter)="login()"
      />
      <p-message *ngIf="usernameInvalid" severity="error" text="El usuario es requerido." />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <p-password
        id="password"
        [(ngModel)]="password"
        placeholder="Ingresa tu contraseña"
        [feedback]="false"
        [toggleMask]="true"
        [class.ng-invalid]="passwordInvalid"
        [class.ng-dirty]="passwordInvalid"
        styleClass="w-full"
        inputStyleClass="w-full"
        (keydown.enter)="login()"
      />
      <p-message *ngIf="passwordInvalid" severity="error" text="La contraseña es requerida." />
    </div>

    <ng-template pTemplate="footer">
      <p-button
        label="Ingresar"
        icon="pi pi-sign-in"
        styleClass="w-full"
        (onClick)="login()"
      />
      <div class="register-link">
        ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
      </div>
    </ng-template>
  </p-card>
</div>
