<p-toast position="top-right" />

<div class="page-wrapper">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h2 class="page-title">Tablero Kanban</h2>
      <p class="page-sub">Gestión de tickets por estado</p>
    </div>
    <div class="header-actions">
      <a routerLink="/home/ticket-list" class="btn-secondary">
        <i class="pi pi-list"></i> Vista lista
      </a>
      <p-button *hasPermission="'ticket:add'"
        label="Crear ticket" icon="pi pi-plus"
        (onClick)="showCreate = true" />
    </div>
  </div>

  <!-- Filtros rápidos -->
  <div class="filters-row">
    <button class="filter-btn" [class.active]="activeFilter === 'all'"
      (click)="activeFilter = 'all'">
      <i class="pi pi-th-large"></i> Todos
    </button>
    <button class="filter-btn" [class.active]="activeFilter === 'mine'"
      (click)="activeFilter = 'mine'">
      <i class="pi pi-user"></i> Mis tickets
    </button>
    <button class="filter-btn" [class.active]="activeFilter === 'unassigned'"
      (click)="activeFilter = 'unassigned'">
      <i class="pi pi-user-minus"></i> Sin asignar
    </button>
    <button class="filter-btn" [class.active]="activeFilter === 'high'"
      (click)="activeFilter = 'high'">
      <i class="pi pi-arrow-up"></i> Prioridad alta
    </button>
  </div>

  <!-- Kanban board -->
  <div class="kanban-board">
    <div *ngFor="let status of statuses" class="kanban-col"
      (dragover)="onDragOver($event)"
      (drop)="onDrop($event, status)">

      <!-- Column header -->
      <div class="col-header" [style.border-color]="getStatusColor(status)">
        <span class="col-dot" [style.background]="getStatusColor(status)"></span>
        <span class="col-title">{{ status }}</span>
        <span class="col-count">{{ byStatus(status).length }}</span>
      </div>

      <!-- Ticket cards -->
      <div class="col-cards">
        <div *ngFor="let t of byStatus(status)"
          class="ticket-card"
          draggable="true"
          (dragstart)="onDragStart(t)">

          <div class="tc-top">
            <span class="tc-id">#{{ t.id }}</span>
            <p-tag [value]="t.priority" [severity]="getPrioritySeverity(t.priority)"
              styleClass="priority-tag" />
          </div>

          <a [routerLink]="['/home/ticket', t.id]" class="tc-title">{{ t.title }}</a>

          <div class="tc-bottom">
            <div class="tc-avatar" [title]="t.assignedTo">
              {{ t.assignedTo ? t.assignedTo.charAt(0).toUpperCase() : '?' }}
            </div>
            <span class="tc-date" *ngIf="t.dueDate">
              <i class="pi pi-calendar"></i>
              {{ t.dueDate | date:'d MMM' }}
            </span>
            <span class="tc-comments" *ngIf="t.comments.length">
              <i class="pi pi-comment"></i> {{ t.comments.length }}
            </span>
          </div>
        </div>

        <!-- Empty state -->
        <div *ngIf="byStatus(status).length === 0" class="col-empty">
          <i class="pi pi-inbox"></i>
          <span>Sin tickets</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Dialog crear ticket -->
<p-dialog [(visible)]="showCreate" header="Crear ticket"
  [modal]="true" [style]="{ width: '480px' }" [draggable]="false">

  <div class="form-grid">
    <div class="field">
      <label>Título *</label>
      <input pInputText [(ngModel)]="newTicket.title" placeholder="Título del ticket" class="w-full" />
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea pTextarea [(ngModel)]="newTicket.description"
        placeholder="Describe el problema o tarea..." rows="3" class="w-full"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Estado inicial</label>
        <p-select [(ngModel)]="newTicket.status" [options]="statuses"
          placeholder="Estado" styleClass="w-full" />
      </div>
      <div class="field">
        <label>Prioridad</label>
        <p-select [(ngModel)]="newTicket.priority" [options]="priorities"
          placeholder="Prioridad" styleClass="w-full" />
      </div>
    </div>
    <div class="field">
      <label>Asignado a</label>
      <input pInputText [(ngModel)]="newTicket.assignedTo"
        placeholder="Usuario (opcional)" class="w-full" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="showCreate = false" />
    <p-button label="Crear ticket" icon="pi pi-plus" (onClick)="createTicket()" />
  </ng-template>
</p-dialog>
