<aside class="sidebar" [class.collapsed]="collapsed">


  <div class="sidebar-brand">
    <div class="brand-icon"><i class="pi pi-building"></i></div>
    <span class="brand-name" *ngIf="!collapsed">ERP</span>
    <button class="toggle-btn" (click)="toggle()"
      [pTooltip]="collapsed ? 'Expandir' : 'Colapsar'" tooltipPosition="right">
      <i class="pi" [class.pi-chevron-left]="!collapsed" [class.pi-chevron-right]="collapsed"></i>
    </button>
  </div>

  <div class="sidebar-scroll">


    <div class="nav-group">
      <span class="group-label" *ngIf="!collapsed">ADMIN</span>
      <a *ngFor="let item of adminItems"
        [routerLink]="item.route" routerLinkActive="active"
        class="nav-item"
        [pTooltip]="collapsed ? item.label : ''" tooltipPosition="right">
        <i [class]="item.icon"></i>
        <span *ngIf="!collapsed">{{ item.label }}</span>
      </a>
    </div>

    <div class="nav-group">
      <span class="group-label" *ngIf="!collapsed">PAGES</span>
      <a *ngFor="let item of pageItems"
        [routerLink]="item.route" routerLinkActive="active"
        class="nav-item"
        [pTooltip]="collapsed ? item.label : ''" tooltipPosition="right">
        <i [class]="item.icon"></i>
        <span *ngIf="!collapsed">{{ item.label }}</span>
      </a>
    </div>

  </div>


  <div class="sidebar-footer">
    <a routerLink="/home/profile" class="user-info" [pTooltip]="collapsed ? 'Mi perfil' : ''" tooltipPosition="right">
      <div class="user-avatar">A</div>
      <div class="user-details" *ngIf="!collapsed">
        <span class="user-name">Administrador</span>
        <span class="user-role">Ver perfil →</span>
      </div>
    </a>
    <button class="logout-btn"
      [pTooltip]="'Cerrar sesión'"
      [tooltipPosition]="collapsed ? 'right' : 'top'">
      <i class="pi pi-sign-out"></i>
    </button>
  </div>

</aside>
